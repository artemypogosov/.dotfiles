#################################
#            SHADOWS            #
#################################

# Enabled client-side shadows on windows.
shadow = true;

# The blur radius for shadows, in pixels. (defaults to 12)
shadow-radius = 18;

# The opacity of shadows. (0.0 - 1.0, defaults to 0.75)
shadow-opacity = 0.75;

# The left offset for shadows, in pixels. (defaults to -15)
shadow-offset-x = -15;

# The top offset for shadows, in pixels. (defaults to -15)
shadow-offset-y = -15;

# Specify a list of conditions of windows that should have no shadow.
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'trayer'",
  "class_g = 'Dunst'",
  "class_g ?= 'Notify-osd'",
  "class_g *?= 'slop'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:32c",
  "bounding_shape"
];

#################################
#   TRANSPARENCY / OPACITY      #
#################################

# Dim inactive windows. (0.0 - 1.0, defaults to 0.0)
inactive-dim = 0.2;

# Specify a list of conditions of windows that should never be considered focused.
focus-exclude = [ "class_g = 'Google-chrome'" ];

#################################
#            CORNERS            #
#################################

# Sets the radius of rounded window corners. 
corner-radius = 20;

# Exclude conditions for rounded corners.
rounded-corners-exclude = [
  "window_type = 'tooltip'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dock'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "width = 2560 && height = 1440"
];

# Exclude conditions for background blur.
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:32c",
  "class_g = 'Dunst'",
  "class_g *?= 'slop'"
];

#################################
#        GENERAL SETTINGS       #
#################################

# Specify the backend to use: `xrender`, `glx`, or `egl`.
backend = "glx";

# Use higher precision during rendering, and apply dither when presenting the rendered screen.
dithered-present = false;

# Try to detect WM windows and mark them as active.
mark-wmwin-focused = true;

# Mark override-redirect windows that don't have a child window with 'WM_STATE' focused.
mark-ovredir-focused = false;

# Detect '_NET_WM_WINDOW_OPACITY' on client windows.
detect-client-opacity = true;

# Use EWMH '_NET_ACTIVE_WINDOW' to determine currently focused window.
# MUST BE SET TO 'false' FOR 'inactive-dim' TO WORK PROPERLY.
use-ewmh-active-win = false;

# Unredirect all windows if a full-screen opaque window is detected.
unredir-if-possible = false;

# Use 'WM_TRANSIENT_FOR' to group windows.
detect-transient = true;

# Enable or disable VSync.
vsync = true;

# Enable damage tracking (Redraw only parts of the screen that changed).
use-damage = true;

# Use X Sync fence to sync clients' draw calls. Necessary for GLX backend stability.
xrender-sync-fence = true;

# Set the log level.
log-level = "warn";

#################################
#          WINDOW TYPES         #
#################################

wintypes:
{
  tooltip       = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock          = { shadow = true; clip-shadow-above = true; corner-radius = 10; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 1.0; };
  notification  = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
